[CONFIGURATION]
VERSION=1
AFFECTED_SECTIONS=PXN_V10

; Contoh preset format native PXN V10.
; Nilai di bawah hanyalah contoh awal - sesuaikan sebelum dikirim ke setir.
; Bagian yang dihilangkan tidak mengubah parameter tersebut di setir.

[PXN_V10:GENERAL]
NAME=Contoh preset PXN V10
; 1 = D-Input, 2 = X-Input, 5 = PS4, 8 = Xbox One, 10 = Android, 11 = Switch
MODE=1
; 1 = PC, 3 = PS4, 4 = Switch, 5 = Xbox One, 6 = Android
PLATFORM=1

[PXN_V10:WHEEL]
; sudut putar 90..900 derajat (hanya jika firmware mengizinkan angle dari aplikasi)
ANGLE=900
; kekuatan force feedback 0..100
FFB=80
; 0 = normal, 1 = dibalik
FFB_REVERSE=0
; empat gaya fisika 0..100 (hanya D-Input / PS4)
SPRING=70
DAMPING=60
FRICTION=50
INERTIA=50

[PXN_V10:CURVE_ACC]
; empat titik kontrol "x,y": x = input ADC 0..4095, y = output 0..65535 (harus menaik)
P0=0,0
P1=1365,21845
P2=2730,43690
P3=4095,65535

[PXN_V10:KEYMAP]
; <tombol fisik>=<fungsi>. Hanya tombol yang diubah yang perlu ditulis.
; nama: VIEW L3 R3 MENU UP RIGHT DOWN LEFT Y B A X L1 R1 L2 R2 HOME SHARE
;       ACCELERATOR BRAKE CLUTCH HANDBRAKE LEVER_L LEVER_R GEAR_1..GEAR_6 GEAR_R
;       KEY_A..KEY_Z KEY_1..KEY_9 KEY_F1..KEY_F12 KEY_SPACE KEY_ENTER MOUSE_LEFT ...
L1=R1
R1=L1
